name: Aegis Engine Android CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK and verify native libraries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK and 16 KB native alignment
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK_PATH"
          echo "APK: $APK_PATH"

          ZIPALIGN="$ANDROID_HOME/build-tools/36.0.0/zipalign"
          "$ZIPALIGN" -c -P 16 -v 4 "$APK_PATH"

          READELF="$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          mapfile -t LIBS < <(find virtual-core/build/intermediates -type f -name 'libaegis_guest.so')
          test "${#LIBS[@]}" -gt 0
          for so in "${LIBS[@]}"; do
            echo "Checking $so"
            "$READELF" -l "$so" | awk '/LOAD/ { if ($NF != "0x4000" && $NF != "0x10000") bad=1; seen=1 } END { if (!seen || bad) exit 1 }'
          done

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: aegis-engine-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
