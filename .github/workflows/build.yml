name: Aegis Engine Android CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK & Verify 16 KB ELF Page Alignment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK & NDK 27
        uses: android-actions/setup-android@v3
        with:
          packages: 'tools platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.0.12077973 cmake;3.22.1'

      - name: Grant execute permission for gradlew
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Verify 16 KB ELF Alignment of libaegis_guest.so (zipalign & llvm-readelf)
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "Inspecting APK: $APK_PATH"
          ZIPALIGN_BIN=$(find $ANDROID_HOME/build-tools -name "zipalign" | sort -V | tail -n 1)
          if [ -n "$ZIPALIGN_BIN" ]; then
            "$ZIPALIGN_BIN" -c -v 4 "$APK_PATH" || true
          fi
          SO_FILES=$(find virtual-core/build -name "libaegis_guest.so")
          READELF_BIN=$(find $ANDROID_HOME/ndk -name "llvm-readelf" | head -n 1)
          for so in $SO_FILES; do
            echo "Checking LOAD segment alignment in $so"
            if [ -n "$READELF_BIN" ]; then
              "$READELF_BIN" -l "$so" | grep -E "LOAD|0x4000"
            fi
          done

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aegis-engine-debug-apk
          path: app/build/outputs/apk/debug/*.apk
